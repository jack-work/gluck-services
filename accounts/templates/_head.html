<!doctype html>
<html lang="en"{% if scheme %} data-scheme="{{ scheme }}"{% endif %}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin">
<title>settings · kelliher.info</title>
<link rel="stylesheet" href="/static/zanni/fonts.css">
<link rel="stylesheet" href="/static/zanni/gesso.css">
<link rel="stylesheet" href="/static/zanni/fontpack.css">
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 18px/1.55 var(--fontpack-prose); }
  main { max-width: 34rem; margin: 0 auto; padding: 3rem 1.2rem 4rem; }
  h1 { font: 400 2.6rem/1 var(--fontpack-display); letter-spacing: .02em; margin: 0 0 .3rem; }
  .who { font: 18px/1.2 var(--fontpack-mono); color: var(--z-muted); letter-spacing: .04em; margin: 0 0 2.2rem; }
  section { border-top: 1px solid var(--z-rule); padding: 1.4rem 0 1.6rem; }
  h2 { font: 400 1.6rem/1.1 var(--fontpack-display); letter-spacing: .02em; margin: 0 0 .8rem; }
  p { margin: 0 0 .8rem; color: var(--z-muted); }
  .value { color: var(--z-ink); font: 19px/1.3 var(--fontpack-mono); letter-spacing: .02em; overflow-wrap: anywhere; }
  label { display: block; font: 18px/1.1 var(--fontpack-mono); letter-spacing: .04em; margin: .9rem 0 .35rem; }
  input[type=text], input[type=email] {
    width: 100%; box-sizing: border-box; padding: .55rem .7rem; font: inherit; color: var(--z-ink);
    background: light-dark(#fbf6f0, #140a0b); border: 1px solid var(--z-line); border-radius: 4px;
  }
  input:focus { outline: 1px solid var(--z-focus); border-color: var(--z-focus); }
  .choices { display: flex; gap: .6rem; flex-wrap: wrap; margin: .2rem 0 .4rem; }
  .choices label { display: flex; align-items: center; gap: .45rem; margin: 0; padding: .45rem .8rem;
    border: 1px solid var(--z-line); border-radius: 4px; cursor: pointer; }
  .choices label:has(input:checked) { border-color: var(--z-focus); background: var(--z-tint); }
  input[type=radio] { accent-color: var(--z-accent); }
  button { margin-top: 1rem; padding: .5rem 1rem; font: 19px/1.1 var(--fontpack-mono); letter-spacing: .04em;
    border: 1px solid var(--z-accent); border-radius: 4px; background: var(--z-accent); color: var(--z-on-accent); cursor: pointer; }
  .note { padding: .6rem .9rem; border-left: 3px solid var(--z-focus); background: var(--z-tint); color: var(--z-ink); margin: 0 0 1.6rem; }
  .error { border-left-color: var(--z-fail); }
  .pending { color: var(--z-warn); }
</style>
</head>
